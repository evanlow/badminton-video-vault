name: Test and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ── Job 1: Run smoke tests ─────────────────────────────────────────────────
  test:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression suite
        run: python tests/run_all_smoke.py

      - name: Run upload client behavior test
        run: node tests/upload_client.test.js

  # ── Job 2: Deploy to EC2 (only runs if test job passed) ────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd /srv/badminton-video-vault

            # Pull latest code without creating an unexpected merge commit.
            git pull --ff-only origin main

            # Upgrade the historical MAX_VIDEO_FILE_SIZE default (2 GiB) to
            # the new 3 GiB default. Only rewrite the value if it still
            # matches the old default exactly, preserving any deliberate
            # custom override left in place by an operator.
            if [ -f .env ] && grep -qx 'MAX_VIDEO_FILE_SIZE=2147483648' .env; then
              sed -i 's/^MAX_VIDEO_FILE_SIZE=2147483648$/MAX_VIDEO_FILE_SIZE=3221225472/' .env
              echo "Upgraded MAX_VIDEO_FILE_SIZE from the old 2 GiB default to 3 GiB."
            fi

            # Activate venv and update dependencies.
            source venv/bin/activate
            python -m pip install -r requirements.txt

            # Restart the application service.
            sudo systemctl restart badminton-vault

            # Confirm the app responds over the systemd-managed Unix socket.
            # The service uses RuntimeDirectory=badminton-vault, so the socket
            # lives inside /run/badminton-vault/ rather than directly in /run.
            for attempt in {1..15}; do
              if curl --fail --silent --show-error --max-time 10 \
                  --unix-socket /run/badminton-vault/badminton-vault.sock \
                  http://localhost/login > /dev/null; then
                echo "Application responded successfully (attempt $attempt)."
                exit 0
              fi
              echo "Attempt $attempt: application not ready yet, retrying..."
              sleep 2
            done

            echo "Application did not respond over its Unix socket!"
            sudo systemctl status badminton-vault --no-pager -l || true
            sudo journalctl -u badminton-vault -n 100 --no-pager || true
            sudo tail -n 100 /var/log/badminton-vault/error.log || true
            exit 1
